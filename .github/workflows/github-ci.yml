name: Java CI with Docker Check

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn clean test

      - name: Build JAR
        run: mvn package -DskipTests

      - name: Build Docker Image
        run: docker build -t my-app-image .

      - name: Run Docker Container
        run: docker run -d -p 8080:8080 --name test-container my-app-image

      - name: Health check with Curl
        run: |
          for i in {1..10}; do
            if curl -s -f http://localhost:8080/api/hello; then
              echo "Success"
              exit 0
            fi
            sleep 3
          done
          echo "Error: App failed to start in time"
          docker logs test-container
          exit 1